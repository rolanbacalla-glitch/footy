<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="crestC_shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E222B" />
      <stop offset="100%" stopColor="#0B0D12" />
    </linearGradient>
    <linearGradient id="crestC_flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#8A0713" />
      <stop offset="50%" stopColor="#C8102E" />
      <stop offset="100%" stopColor="#FF3848" />
    </linearGradient>
    <filter id="crestC_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#C8102E" floodOpacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="120" height="120" rx="28" fill="#0A0C0F" />

  <!-- Monolithic Minimal Shield Foundation -->
  <path d="M 60 18 C 84 18 94 26 94 48 C 94 76 60 102 60 102 C 60 102 26 76 26 48 C 26 26 36 18 60 18 Z"
        fill="url(#crestC_shield)" stroke="rgba(255,255,255,0.14)" stroke-width="2" filter="url(#crestC_glow)" />

  <!-- Inner Architectural Inset (Shankly Gates / Kop Geometry Motif) -->
  <path d="M 60 26 C 78 26 86 32 86 50 C 86 72 60 92 60 92 C 60 92 34 72 34 50 C 34 32 42 26 60 26 Z"
        stroke="rgba(255,255,255,0.08)" stroke-width="1.2" fill="none" />

  <!-- Abstract Vector Wing / Flame: Inspired by the Liver Bird silhouette & eternal flame, reimagined as a dynamic aerodynamic wing -->
  <path d="M 60 36 C 68 44 76 46 78 38 C 80 50 72 66 60 78 C 58 64 54 52 46 46 C 44 44 44 40 48 40 C 53 40 57 44 60 36 Z"
        fill="url(#crestC_flame)" />

  <!-- Data Pulse Beacon (The Intelligence Core) -->
  <circle cx="60" cy="78" r="3.5" fill="#FFFFFF" />
  <circle cx="60" cy="78" r="1.5" fill="#C8102E" />

  <!-- Precision Crosshair Micro-Tick Marks (Analytics Feel) -->
  <line x1="60" y1="21" x2="60" y2="24" stroke="#FF2636" stroke-width="1.8" stroke-linecap="round" />
  <line x1="28" y1="48" x2="31" y2="48" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="89" y1="48" x2="92" y2="48" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />
</svg>
