<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer Ball Circumference -->
  <circle
    cx="16"
    cy="16"
    r="14"
    fill="#FFFFFF"
    stroke="#E31B23"
    strokeWidth="1.5"
  />

  <!-- Central Pentagon (Dark Charcoal Core) -->
  <polygon
    points="16,11 20.76,14.45 18.94,20.05 13.06,20.05 11.24,14.45"
    fill="#11161B"
    stroke="#E31B23"
    strokeWidth="0.8"
    strokeLinejoin="round"
  />

  <!-- Five Perimeter Patches & Radiating Seam Connectors -->
  <!-- Top Seam & Top Patch -->
  <line x1="16" y1="11" x2="16" y2="2" stroke="#11161B" strokeWidth="1.4" strokeLinecap="round" />
  <path d="M11 2.9 C14 2.1 18 2.1 21 2.9 L19 5.8 H13 Z" fill="#11161B" />

  <!-- Top Right Seam & Patch -->
  <line x1="20.76" y1="14.45" x2="29.3" y2="11.7" stroke="#11161B" strokeWidth="1.4" strokeLinecap="round" />
  <path d="M28.5 7.5 C30.2 10.2 30.5 13.5 29.8 16.5 L26.8 14.5 L27 10 Z" fill="#11161B" />

  <!-- Bottom Right Seam & Patch -->
  <line x1="18.94" y1="20.05" x2="24.2" y2="28.9" stroke="#11161B" strokeWidth="1.4" strokeLinecap="round" />
  <path d="M27.3 22.8 C25.5 26.2 22.5 28.5 19 29.8 L20.5 26.5 L24.5 24 Z" fill="#11161B" />

  <!-- Bottom Left Seam & Patch -->
  <line x1="13.06" y1="20.05" x2="7.8" y2="28.9" stroke="#11161B" strokeWidth="1.4" strokeLinecap="round" />
  <path d="M4.7 22.8 C6.5 26.2 9.5 28.5 13 29.8 L11.5 26.5 L7.5 24 Z" fill="#11161B" />

  <!-- Top Left Seam & Patch -->
  <line x1="11.24" y1="14.45" x2="2.7" y2="11.7" stroke="#11161B" strokeWidth="1.4" strokeLinecap="round" />
  <path d="M3.5 7.5 C1.8 10.2 1.5 13.5 2.2 16.5 L5.2 14.5 L5 10 Z" fill="#11161B" />

  <!-- Outer Seam Ring Detail -->
  <circle
    cx="16"
    cy="16"
    r="14"
    stroke="#11161B"
    strokeWidth="1.4"
  />
</svg>
