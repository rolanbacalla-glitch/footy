<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="matrixB_glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stopColor="#C8102E" stopOpacity="0.4" />
      <stop offset="70%" stopColor="#C8102E" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#0A0C0F" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="matrixB_pillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF3848" />
      <stop offset="100%" stopColor="#9E0A16" />
    </linearGradient>
    <filter id="matrixB_drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#000000" floodOpacity="0.75" />
    </filter>
  </defs>

  <!-- Background Base Tile -->
  <rect width="120" height="120" rx="28" fill="#0D1015" />
  <circle cx="60" cy="60" r="48" fill="url(#matrixB_glow)" />

  <!-- Outer HUD Calibration Ring -->
  <circle cx="60" cy="60" r="44" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" stroke-dasharray="4 4" />
  <circle cx="60" cy="60" r="40" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Tactical Pitch Halfway / Center Spot Indicator -->
  <line x1="60" y1="18" x2="60" y2="28" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="60" y1="92" x2="60" y2="102" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Network Interconnect Vectors (Opta Pass Matrix) -->
  <g stroke="rgba(255,255,255,0.22)" stroke-width="1.8" stroke-linecap="round">
    <line x1="38" y1="78" x2="60" y2="40" />
    <line x1="82" y1="78" x2="60" y2="40" />
    <line x1="38" y1="78" x2="82" y2="78" />
  </g>

  <!-- High-Volume Pass Beam (Anfield Red Pulse) -->
  <line x1="60" y1="40" x2="82" y2="78" stroke="#FF2636" stroke-width="3" stroke-linecap="round" />

  <!-- Three Core Nodes (The Tactical Triangle: Inverted Pivot & Half-Space Creators) -->
  <!-- Top Apex Node: The Forward / Advanced Playmaker -->
  <g filter="url(#matrixB_drop)">
    <circle cx="60" cy="40" r="10" fill="#161922" stroke="#FFFFFF" stroke-width="2.5" />
    <circle cx="60" cy="40" r="5" fill="#FFFFFF" />
  </g>

  <!-- Left Base Node: Deep Playmaker (DM / CB) -->
  <g filter="url(#matrixB_drop)">
    <circle cx="38" cy="78" r="9" fill="#161922" stroke="rgba(255,255,255,0.6)" stroke-width="2" />
    <circle cx="38" cy="78" r="4.2" fill="#8E8E93" />
  </g>

  <!-- Right Base Node: Overload Winger (Electric Crimson) -->
  <g filter="url(#matrixB_drop)">
    <circle cx="82" cy="78" r="10.5" fill="#161922" stroke="#FF2636" stroke-width="2.5" />
    <circle cx="82" cy="78" r="5.5" fill="url(#matrixB_pillar)" />
    <circle cx="82" cy="78" r="2.2" fill="#FFFFFF" />
  </g>

  <!-- Central Pulse Spot -->
  <circle cx="60" cy="65" r="2" fill="#FF2636" />
</svg>
