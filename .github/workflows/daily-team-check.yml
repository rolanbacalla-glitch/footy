name: Daily Team Database Check & Sync

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync Premier League & UEFA European Cup team database
        run: node scripts/sync-teams.mjs --write

      - name: Verify complete team coverage
        run: node scripts/sync-teams.mjs --check

      - name: Verify all live data feeds (scoreboards, standings, rosters, RSS, weather, crests)
        run: node scripts/check-live-data.mjs

      - name: Commit and push updated team metadata if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet src/data/europeanClubs.js; then
            git add src/data/europeanClubs.js
            git commit -m "chore: daily sync of European cup team database"
            git push
          else
            echo "No team database changes detected."
          fi
